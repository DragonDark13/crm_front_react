name: One-time ESLint dependency lock update

on:
  push:
    branches:
      - fix/frontend-audit-issues-2026-11

permissions:
  contents: write

jobs:
  update-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: fix/frontend-audit-issues-2026-11
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Add the ESLint React plugin and update lockfile
        run: npm install --save-dev eslint-plugin-react@^7.37.5
      - name: Commit dependency files
        run: |
          if ! git diff --quiet -- package.json package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package.json package-lock.json
            git commit -m "Add missing ESLint React plugin"
            git push origin fix/frontend-audit-issues-2026-11
          fi
