name: Frontend CI

on:
  push:
    branches:
      - main
      - fix/frontend-audit-issues-2026-11
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  frontend-checks:
    name: TypeScript, build and ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Synchronize npm lockfile
        if: github.event_name == 'pull_request'
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize npm lockfile"
            git push origin "HEAD:${GITHUB_HEAD_REF}"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Check application TypeScript
        run: npx tsc --noEmit -p tsconfig.json

      - name: Check Vite configuration TypeScript
        run: npx tsc --noEmit -p tsconfig.node.json

      - name: Build production bundle
        run: npm run build

      - name: Run ESLint
        run: npm run lint
